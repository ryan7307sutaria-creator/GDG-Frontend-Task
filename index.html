<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <header class="navbar">
        <div class="navbar_content">
            <div class="navbar_content-logo">
                <img src="assets/images/logo.svg.svg" alt="">
                <div>Vertex</div>
            </div>
            <div class="navbar_content-buttons">
                    <a href="#features">Features</a>
                    <a href="#pricing">Pricing</a>
                    <a href="#download">Download</a>
                    <a href="#contact">Contact</a>
            </div>
        </div>
    </header>
    <section class="hero">
        <div class="hero_content">
            <div class="hero_content-label">
                <div>

                </div>
                <p>
                    Join over 10k+ users
                </p>
            </div>
            <div class="hero_content-text">
                <div class="hero_content-heading">
                    <p>Vertex — screen capture, reimagined</p>
                </div>
                <div class="hero_content-summary">
                    <p>Screenshot, annotate, and share in seconds. No friction, no clutter.</p>
                </div>
            </div>
            <div class="hero_content-buttons">
                <button class="buttons-download"><img src="assets/images/download.svg" alt=""> Download for free</button>
                <button class="buttons-feature">See features</button>
            </div>
        </div>
        <div class="hero_dashboard">
            <div class="hero_dashboard-image">
                <img src="assets/images/hero-image.svg" alt="">
            </div>
            <div class="hero_logos">
                <p>Trusted by thousands of businesses</p>
                <div class="hero_logos-section">
                    <img src="assets/images/section.svg" alt="">
                </div>
            </div>
        </div>

    </section>
</body>
</html>
